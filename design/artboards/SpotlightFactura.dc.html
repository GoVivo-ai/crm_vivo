<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:'Nunito Sans',system-ui,sans-serif;color:#0A1E3F;-webkit-font-smoothing:antialiased}
    a{color:#069B66}
    .gcard{background:#fff;border:1px solid #E3E8F0;border-radius:14px}
    .kbd{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font:700 10.5px 'Nunito Sans',sans-serif;color:rgba(255,255,255,.8)}
    .fld{display:flex;flex-direction:column;gap:6px}
    .fld label{font:700 12px 'Nunito Sans',sans-serif}
    .in{height:40px;border:1px solid #E3E8F0;border-radius:10px;padding:0 13px;font:600 13px 'Nunito Sans',sans-serif;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .seg{display:flex;background:#EEF1F6;border-radius:999px;padding:3px;gap:2px;width:fit-content}
    .seg span{padding:6px 13px;border-radius:999px;font:700 12px 'Nunito Sans',sans-serif;color:#5A6B85}
    .seg span.on{background:#fff;color:#011640;font-weight:800;box-shadow:0 1px 2px rgba(1,22,64,.12)}
    .btn{display:inline-flex;align-items:center;height:38px;padding:0 18px;border-radius:999px;font:800 13px 'Nunito Sans',sans-serif;border:1px solid transparent}
  </style>
</helmet>

<div style="width:1440px;height:900px;position:relative;overflow:hidden;background:#F6F7F9">
  <!-- App de fondo -->
  <div style="position:absolute;inset:0;display:flex">
    <div style="width:236px;background:#011640;padding:22px 14px"><img src="logo-vivo-white.png" alt="" style="height:26px"><div style="margin-top:26px;display:flex;flex-direction:column;gap:10px"><div style="height:34px;border-radius:999px;background:rgba(255,255,255,.10)"></div><div style="height:34px;border-radius:999px;background:rgba(255,255,255,.06)"></div><div style="height:34px;border-radius:999px;background:rgba(255,255,255,.06)"></div></div></div>
    <div style="flex:1;display:flex;flex-direction:column">
      <div style="height:64px;background:#fff;border-bottom:1px solid #E3E8F0;display:flex;align-items:center;padding:0 28px;font:800 18px 'Nunito',sans-serif;color:#011640">Finanzas</div>
      <div style="padding:24px 28px;display:flex;flex-direction:column;gap:18px">
        <div style="display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:16px"><div class="gcard" style="height:120px"></div><div class="gcard" style="height:120px"></div><div class="gcard" style="height:120px"></div><div class="gcard" style="height:120px"></div></div>
        <div class="gcard" style="height:420px"></div>
      </div>
    </div>
  </div>
  <!-- Scrim profundo con aura -->
  <div style="position:absolute;inset:0;background:radial-gradient(720px 420px at 50% 18%,rgba(4,217,139,.14),transparent 70%),rgba(1,22,64,.74)"></div>

  <!-- SPOTLIGHT -->
  <div style="position:absolute;left:50%;top:96px;transform:translateX(-50%);width:720px;display:flex;flex-direction:column;gap:14px">
    <!-- barra de comando -->
    <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:14px 20px;backdrop-filter:blur(2px)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#04D98B" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      <span style="font:800 17px 'Nunito',sans-serif;color:#fff">factura grupo andino 14.6</span>
      <span style="width:2px;height:20px;background:#04D98B;border-radius:2px"></span>
      <div style="margin-left:auto;display:flex;gap:6px"><span class="kbd">F factura</span><span class="kbd">G gasto</span><span class="kbd">N nómina</span></div>
    </div>
    <!-- formulario flotante -->
    <div style="background:#fff;border-radius:20px;box-shadow:0 40px 100px -32px rgba(0,10,30,.7);overflow:hidden">
      <div style="height:3px;background:linear-gradient(90deg,#04D98B,#F2E205)"></div>
      <div style="padding:22px 28px 6px;text-align:center">
        <div style="font:700 10.5px 'Nunito Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8B99B0">Nueva factura · Grupo Andino S.A.S.</div>
        <div style="font:800 44px/1.1 'Nunito',sans-serif;color:#011640;font-variant-numeric:tabular-nums;margin-top:6px">$ 14.600.000</div>
        <div style="font:600 12px 'Nunito Sans',sans-serif;color:#069B66;margin-top:4px">Entendido del texto: cliente + monto · corrige abajo si algo no es</div>
      </div>
      <div style="padding:14px 28px 20px;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:14px">
        <div class="fld"><label>Emitida</label><div class="in" style="justify-content:flex-start">25 ago 2026</div></div>
        <div class="fld"><label>Vence</label><div class="in" style="justify-content:flex-start">24 sep 2026</div></div>
        <div class="fld"><label>Estado</label><div class="seg"><span class="on">Abierta</span><span>Pagada</span></div></div>
      </div>
      <div style="display:flex;align-items:center;border-top:1px solid #EDF0F5;padding:13px 28px;gap:14px">
        <span style="font:600 11.5px 'Nunito Sans',sans-serif;color:#8B99B0">Enter guarda · Tab siguiente campo · Esc cierra</span>
        <div style="margin-left:auto;display:flex;gap:10px"><div class="btn" style="border-color:#E3E8F0;background:#fff;color:#0A1E3F">Cancelar</div><div class="btn" style="background:#04D98B;color:#011640">Guardar factura ⏎</div></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
